plugins {
    id 'com.android.application'
}

android {
    namespace 'es.pegasusdgt'
    compileSdk 35

    defaultConfig {
        applicationId 'es.pegasusdgt'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        fija {
            storeFile file('../app/avisos.keystore')
            storePassword 'avisos123'
            keyAlias 'avisos'
            keyPassword 'avisos123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fija
        }
        debug {
            signingConfig signingConfigs.fija
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Reconocimiento de actividad (saber que vas en coche)
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
