plugins {
    id 'com.android.application'
}

android {
    namespace 'es.avisosaviones'
    compileSdk 35

    defaultConfig {
        applicationId 'es.avisosaviones'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        // Clave fija incluida en el repo para que las actualizaciones se instalen encima
        // sin desinstalar. Es solo para uso personal.
        fija {
            storeFile file('avisos.keystore')
            storePassword 'avisos123'
            keyAlias 'avisos'
            keyPassword 'avisos123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fija
        }
        debug {
            signingConfig signingConfigs.fija
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
