name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar
        run: gradle --no-daemon assembleRelease

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk AvisosAviones.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AvisosAviones
          path: AvisosAviones.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Avisos Aviones v1.${{ github.run_number }}
          body: Descarga **AvisosAviones.apk** e instálala en tu Android.
          files: AvisosAviones.apk
          make_latest: true
