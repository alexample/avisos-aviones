name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Lista de aeropuertos (OurAirports)
        run: |
          mkdir -p app/src/main/assets
          curl -sSfL -m 120 https://davidmegginson.github.io/ourairports-data/airports.csv -o /tmp/airports.csv || true
          python3 - <<'EOF'
          import csv, os
          out = []
          if os.path.exists('/tmp/airports.csv'):
              with open('/tmp/airports.csv', encoding='utf-8') as f:
                  for r in csv.DictReader(f):
                      iata = (r.get('iata_code') or '').strip().upper()
                      if len(iata) != 3 or not iata.isalnum():
                          continue
                      tipo = r.get('type', '')
                      if tipo not in ('large_airport', 'medium_airport') and r.get('scheduled_service') != 'yes':
                          continue
                      limpia = lambda s: (s or '').replace('|', ' ').strip()
                      out.append('|'.join([iata, limpia(r.get('icao_code') or r.get('gps_code')),
                                           limpia(r.get('municipality')), limpia(r.get('name')),
                                           limpia(r.get('iso_country')), 'L' if tipo == 'large_airport' else 'M',
                                           limpia(r.get('latitude_deg')), limpia(r.get('longitude_deg'))]))
          open('app/src/main/assets/aeropuertos.txt', 'w', encoding='utf-8').write('\n'.join(out))
          print(len(out), 'aeropuertos')
          EOF

      - name: Compilar
        run: gradle --no-daemon assembleRelease

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk AvisosAviones.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AvisosAviones
          path: AvisosAviones.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Avisos Aviones v1.${{ github.run_number }}
          body: Descarga **AvisosAviones.apk** e instálala en tu Android.
          files: AvisosAviones.apk
          make_latest: true
