name: Prueba API
on:
  push:
    branches: [prueba-api]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL https://raw.githubusercontent.com/wiedehopf/tar1090-db/master/db/icao_aircraft_types2.js | gunzip > t2.json
          python3 -c "
          import json; d=json.load(open('t2.json')); print('N', len(d)); ks=list(d)[:3]
          for k in ['A20N','B738','EC35','H145','C172','A388','R44','GLID','BALL','AS50','F18H','EUFI']: print('ROW', k, json.dumps(d.get(k)))
          "
