name: Prueba API
on:
  push:
    branches: [prueba-api]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== db dir"; curl -sS "https://api.github.com/repos/wiedehopf/tar1090-db/contents/db?ref=master" | grep '"name"' | head -40
          for u in https://raw.githubusercontent.com/wiedehopf/tar1090-db/master/db/icao_aircraft_types.js \
                   https://raw.githubusercontent.com/wiedehopf/tar1090-db/master/db/icao_aircraft_types2.js ; do
            echo "== $u"; curl -sSL -m 30 "$u" | head -c 600; echo; curl -sSL -m 30 "$u" -o /dev/null -w 'HTTP %{http_code} size %{size_download}\n'
          done
