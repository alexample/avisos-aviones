name: Prueba API
on:
  push:
    branches: [prueba-api]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://api.adsb.lol/v2/sqk/7700 https://api.adsb.lol/v2/squawk/7700 https://api.adsb.lol/v2/mil https://api.adsb.lol/v2/reg/EC-MQQ https://api.adsb.lol/v2/hex/3453d3 https://api.adsb.lol/v2/callsign/ANE150N https://api.adsb.lol/v2/type/A388 \
                   https://opendata.adsb.fi/api/v2/sqk/7700 https://opendata.adsb.fi/api/v2/mil https://opendata.adsb.fi/api/v2/registration/EC-MQQ https://opendata.adsb.fi/api/v2/reg/EC-MQQ https://opendata.adsb.fi/api/v2/hex/3453d3 https://opendata.adsb.fi/api/v2/icao/3453d3 https://opendata.adsb.fi/api/v2/callsign/ANE150N https://opendata.adsb.fi/api/v2/type/A388 ; do
            echo "RES $u -> $(curl -s -m 20 -A 'AvisosAviones/1.0 (Android)' -o /tmp/o -w '%{http_code}' "$u") $(head -c 60 /tmp/o | tr -d '\n')"
            sleep 1.5
          done
