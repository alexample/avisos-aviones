name: Prueba API
on:
  push:
    branches: [prueba-api]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for ua in "AvisosAviones/1.0 (Android)" "curl/8.5.0"; do
            for u in "https://api.adsb.lol/v2/point/40.4/-3.7/50" "https://api.adsb.lol/v2/lat/40.4/lon/-3.7/dist/50" "https://opendata.adsb.fi/api/v2/lat/40.4/lon/-3.7/dist/50" "https://api.airplanes.live/v2/point/40.4/-3.7/50"; do
              echo "RES [$ua] $u -> $(curl -s -m 20 -A "$ua" -o /tmp/o -w '%{http_code}' "$u") $(head -c 80 /tmp/o | tr -d '\n')"
              sleep 1.5
            done
          done
