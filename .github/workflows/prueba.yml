name: Prueba API
on:
  push:
    branches: [prueba-api]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -m 30 "https://api.adsb.lol/v2/point/40.4/-3.7/200" -o m.json; sleep 1.5
          curl -s -m 30 "https://api.adsb.lol/v2/point/51.5/-0.1/150" -o l.json
          python3 - <<'PY'
          import json
          for f in ['m.json','l.json']:
              ac=json.load(open(f)).get('ac',[])
              con=[a for a in ac if 'oat' in a or 'tat' in a]
              viento=[a for a in ac if 'ws' in a]
              print('RES', f, 'total', len(ac), 'con temperatura', len(con), 'con viento', len(viento))
              for a in con[:6]:
                  print('RES  ', (a.get('flight') or '').strip(), a.get('t'), 'alt', a.get('alt_baro'), 'oat', a.get('oat'), 'tat', a.get('tat'), 'viento', a.get('wd'), a.get('ws'), 'mach', a.get('mach'), 'tas', a.get('tas'))
          PY
